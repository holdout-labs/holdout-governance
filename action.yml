name: holdout-governance / gov check
description: >-
  Fail-closed governance gate for research artifacts (policy.yml +
  artifact.json). Runs `gov check`; the step fails when the gate chain blocks
  (missing or stale evidence), which is the point.

author: holdout-labs

branding:
  icon: shield
  color: blue

inputs:
  manifest:
    description: >-
      Path to artifact.json to check, relative to the workspace root
      (can be the path written by `gov check`/`gov adjudicate`).
    required: true
  policy:
    description: "Path to policy.yml (default: beside the manifest)"
    required: false
    default: ""
  ref:
    description: >-
      Optional explicit install ref. Empty installs this action
      checkout, so the tag/SHA in uses also selects the installed package
    required: false
    default: ""
  suite:
    description: Install the exact supported companion-tool combination
    required: false
    default: "false"
  python-version:
    description: Python version used to run gov (>= 3.11)
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install holdout-governance
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
        INSTALL_REF: ${{ inputs.ref }}
        INSTALL_SUITE: ${{ inputs.suite }}
      run: |
        extras=""
        if [ "$INSTALL_SUITE" = "true" ]; then extras="[suite]"; fi
        if [ -n "$INSTALL_REF" ]; then
          source="holdout-governance${extras} @ git+https://github.com/holdout-labs/holdout-governance.git@${INSTALL_REF}"
        else
          source="${ACTION_SOURCE}${extras}"
        fi
        python -m pip install "$source"

    - name: Run gov check (fail-closed gate)
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        POLICY: ${{ inputs.policy }}
      run: |
        args=(--manifest "$MANIFEST")
        if [ -n "$POLICY" ]; then args+=(--policy "$POLICY"); fi
        gov check "${args[@]}"
