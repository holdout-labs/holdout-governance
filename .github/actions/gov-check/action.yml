name: "Holdout gov check"
description: "Run the fail-closed evidence check on a research artifact (block on missing evidence)."
inputs:
  manifest:
    description: "Path to the artifact.json (v0.2) to check"
    required: true
  policy:
    description: "Path to policy.yml (default: next to the manifest)"
    required: false
    default: ""
  gate-inputs:
    description: "Path to gate-inputs.json (default: next to the manifest)"
    required: false
    default: ""
  python-version:
    description: "Python version for the tool"
    required: false
    default: "3.11"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install holdout-governance
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
      run: python -m pip install "$ACTION_SOURCE/../../.."
    - name: gov check
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        POLICY: ${{ inputs.policy }}
        GATE_INPUTS: ${{ inputs.gate-inputs }}
      run: |
        args=(--manifest "$MANIFEST")
        if [ -n "$POLICY" ]; then args+=(--policy "$POLICY"); fi
        if [ -n "$GATE_INPUTS" ]; then args+=(--gate-inputs "$GATE_INPUTS"); fi
        gov check "${args[@]}"
