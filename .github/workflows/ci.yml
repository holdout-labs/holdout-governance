name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Version
        run: gov version
      - name: Scaffold and check (fail-closed without evidence)
        # Note: GitHub Actions runs `bash -e` by default, so an expected
        # non-zero exit must be captured via `||`, not `; code=$?`.
        run: |
          gov init --dir /tmp/demo --name smoke
          gov check --manifest /tmp/demo/artifact.json || code=$?
          code=${code:-0}
          # no gate evidence yet -> the gate chain must refuse (exit 2)
          if [ "$code" -eq 2 ]; then
            echo "fail-closed OK (blocked as expected)"
          else
            echo "unexpected exit code: $code (expected 2)"
            exit 1
          fi
      - name: Report (fail-closed report must exit 2)
        run: |
          gov report --manifest /tmp/demo/artifact.json --json || code=$?
          code=${code:-0}
          # blocked artifact -> report exits 2 by design (fail-closed)
          if [ "$code" -eq 2 ]; then
            echo "report OK (fail-closed exit 2 as expected)"
          else
            echo "unexpected exit code: $code (expected 2)"
            exit 1
          fi

  wheel-smoke:
    name: wheel smoke + version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install editable (deps for import check)
        run: python -m pip install -e .
      - name: Version consistency (pyproject vs __version__)
        shell: bash
        run: |
          python - <<'PY'
          import tomllib, pathlib
          import holdout_governance as pkg
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          actual = pkg.__version__
          assert expected == actual, f"pyproject {expected} != __version__ {actual}"
          print("version OK:", actual)
          PY
      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Fresh-venv install smoke
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          /tmp/smoke-venv/bin/gov version
          /tmp/smoke-venv/bin/python -c "import importlib.metadata as m; print('installed dist:', m.version('holdout-governance'))"
