[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "holdout-governance"
version = "0.4.1"
description = "Fail-closed evidence manifests for financial AI research."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema", "pyyaml"]
keywords = ["financial-ai", "governance", "research", "audit", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
gov = "holdout_governance.cli:main"
holdout-governance = "holdout_governance.cli:main"

[project.optional-dependencies]
test = ["pytest", "numpy"]
mcp = ["mcp<2"]  # mcp 2.x renamed FastMCP -> MCPServer; code targets the v1 API

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
